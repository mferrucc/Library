<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library app</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="content">
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <title>bookshelf</title>
                <path d="M9 3V18H12V3H9M12 5L16 18L19 17L15 4L12 5M5 5V18H8V5H5M3 19V21H21V19H3Z" />
            </svg>
            <h1>Library Records</h1>
        </div>
        <div class="library-container">
            <div class="book-grid">
                <div class="grid-header">
                    <div>Title</div>
                    <div>Author</div>
                    <div>Pages</div>
                    <div>Read</div>
                    <div>Remove</div>
                </div>
            </div>
            <div>
                <button class="btnAdd" type="button">Add New Book</button>
            </div>
        </div>
    </div>

    <dialog id="bookDialog" class="book-dialog">
        <form method="dialog" id="bookForm">
            <h2>Add New Book</h2>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" required>
            </div>
            <div class="form-group">
                <label for="pages">Pages</label>
                <input type="number" id="pages" min="1" required>
            </div>
            <div class="form-group-checkbox">
                <input type="checkbox" id="wasRead">
                <label for="wasRead">Already read</label>
            </div>
            <div class="dialog-buttons">
                <button type="button" id="cancelBtn" class="btnCancel">Cancel</button>
                <button type="submit" id="submitBtn" class="btnSubmit">Add Book</button>
            </div>
        </form>
    </dialog>
    
</body>

</html>
