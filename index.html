<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library app</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="content">
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <title>bookshelf</title>
                <path d="M9 3V18H12V3H9M12 5L16 18L19 17L15 4L12 5M5 5V18H8V5H5M3 19V21H21V19H3Z" />
            </svg>
            <h1>Library Records</h1>
        </div>
        <div class="library-container">
            <div class="book-grid">
                <div class="grid-header">
                    <div>Title</div>
                    <div>Author</div>
                    <div>Pages</div>
                    <div>Read</div>
                    <div>Remove</div>
                </div>
                <div class="grid-row" id="1">
                    <div>Lord Of the Seas</div>
                    <div>Joe Watson</div>
                    <div>509</div>
                    <div><input type="checkbox" class="btnRead" id=""></div>
                    <div><button class="btnRemove" type="button">Remove</button></div>
                </div>
                <div class="grid-row" id="2">
                    <div>The Bible</div>
                    <div>Saint Peter</div>
                    <div>1200</div>
                    <div><input type="checkbox" class="btnRead" id=""></div>
                    <div><button class="btnRemove" type="button">Remove</button></div>
                </div>
                <div class="grid-row" id="3">
                    <div>The little prince</div>
                    <div>Antoine Exupery</div>
                    <div>120</div>
                    <div><input type="checkbox" class="btnRead" id=""></div>
                    <div><button class="btnRemove" type="button">Remove</button></div>
                </div>
            </div>
            <div>
                <button class="btnAdd" type="button">Add New Book</button>
            </div>
        </div>
    </div>
</body>

</html>
